<!doctype html>
<html lang="en" class="h-full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">

<title>Ludo Table</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          felt: "#0f2a24", felt2: "#143630", panel: "#1a3f38", line: "#2c5a51",
          ink: "#f3efe2", muted: "#a9c3ba", paper: "#f7f2e3", gold: "#f2c94c",
          pred: "#d8382e", pgreen: "#1d9a52", pyellow: "#efb20a", pblue: "#2563d4",
        },
        fontFamily: {
          display: ['"Baloo 2"', '"Trebuchet MS"', "system-ui", "sans-serif"],
          mono: ['"IBM Plex Mono"', "ui-monospace", "Menlo", "monospace"],
        },
      },
    },
  };
</script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  html { -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  body {
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    padding-left: max(12px, env(safe-area-inset-left, 0px));
    padding-right: max(12px, env(safe-area-inset-right, 0px));
    background: radial-gradient(900px 600px at 30% 10%, #143630, transparent 70%), #0f2a24;
  }
  .token { transition: transform .35s cubic-bezier(.3,.7,.3,1.2); }
  .token.movable { cursor: pointer; }
  /* No browser focus box around a tapped token; keyboard users get the halo instead. */
  .token:focus { outline: none; }
  .token:focus-visible .halo { opacity: 1; stroke: #ffffff; }
  .token .halo { opacity: 0; }
  .token.movable .halo { opacity: 1; animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { stroke-opacity: .95; } 50% { stroke-opacity: .2; } }
  .die-face { box-shadow: 0 4px 0 #b9ae8f, 0 8px 14px rgba(0,0,0,.35); }
  .die-face.rolling { animation: tumble .65s cubic-bezier(.3,.6,.4,1); }
  @keyframes tumble {
    0% { transform: rotate(0) scale(1); }
    25% { transform: rotate(-200deg) scale(.82) translateY(-10px); }
    55% { transform: rotate(-340deg) scale(1.08); }
    80% { transform: rotate(-372deg) scale(.97); }
    100% { transform: rotate(-360deg) scale(1); }
  }
  .die-face.ready { animation: nudge 1.4s ease-in-out infinite; }
  @keyframes nudge { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  @media (prefers-reduced-motion: reduce) {
    .token { transition: none; }
    .token.movable .halo, .die-face.rolling, .die-face.ready { animation: none; }
  }
</style>
</head>
<body class="min-h-full font-display text-ink antialiased">
<div class="mx-auto flex max-w-6xl flex-col gap-3 py-3 lg:gap-5 lg:py-6">

  <!-- Header -->
  <header class="flex flex-wrap items-center justify-between gap-2">
    <h1 class="flex shrink-0 items-center gap-1 whitespace-nowrap text-xl font-extrabold leading-none min-[420px]:text-2xl sm:text-4xl">
      Ludo Table
      <span class="ml-1 hidden gap-0.5 min-[420px]:inline-flex">
        <i class="h-2 w-2 rounded-full bg-pred"></i><i class="h-2 w-2 rounded-full bg-pgreen"></i><i class="h-2 w-2 rounded-full bg-pyellow"></i><i class="h-2 w-2 rounded-full bg-pblue"></i>
      </span>
    </h1>
    <div class="ml-auto flex min-w-0 flex-wrap items-center justify-end gap-1.5 sm:gap-2">
      <span id="modeChip" class="hidden rounded-lg border border-line bg-panel px-2.5 py-1.5 text-sm font-semibold text-muted sm:inline" hidden></span>
      <button id="roomBtn" class="flex items-center gap-1.5 whitespace-nowrap rounded-lg border border-line bg-panel px-2 py-1.5 text-sm font-semibold focus:outline-none focus-visible:ring-2 focus-visible:ring-gold sm:px-2.5" aria-expanded="false" aria-controls="roomPanel" aria-label="Room code" hidden>
        <span class="hidden text-muted min-[420px]:inline">Room</span><span id="roomCode" class="font-mono tracking-wider">------</span>
      </button>
      <button id="copyLink" class="whitespace-nowrap rounded-lg bg-gold px-2.5 py-1.5 text-sm font-bold text-[#2a2208] active:scale-95 focus:outline-none focus-visible:ring-2 focus-visible:ring-ink sm:px-3" hidden>Invite</button>
      <button id="menuBtn" class="whitespace-nowrap rounded-lg border border-line bg-felt2 px-2.5 py-1.5 text-sm font-bold active:scale-95 focus:outline-none focus-visible:ring-2 focus-visible:ring-gold sm:px-3" hidden>Menu</button>
    </div>
  </header>

  <div id="roomPanel" class="hidden flex-col gap-2 rounded-xl border border-line bg-panel p-3 sm:flex-row sm:items-center" hidden>
    <div class="flex flex-1 gap-2">
      <input id="roomInput" maxlength="12" placeholder="Enter a room code" autocomplete="off" autocapitalize="off" class="min-w-0 flex-1 rounded-lg border border-line bg-felt px-3 py-2 font-mono text-base text-ink placeholder:text-muted focus:outline-none focus:ring-2 focus:ring-gold" aria-label="Room code to join">
      <button id="joinRoom" class="rounded-lg border border-line bg-felt2 px-4 py-2 font-bold active:scale-95">Join</button>
    </div>
    <button id="newRoom" class="rounded-lg border border-line bg-felt2 px-4 py-2 font-bold active:scale-95">Start a new room</button>
  </div>

  <div class="flex items-center gap-2 text-xs text-muted sm:text-sm" id="net" hidden>
    <span id="netLed" class="h-2 w-2 shrink-0 rounded-full bg-muted"></span><span id="netText">Connecting…</span>
  </div>

  <div id="banner" class="rounded-xl border border-gold/40 bg-gold/10 px-3 py-2 text-sm" hidden></div>

  <!-- Main menu -->
  <section id="menuScreen" class="mx-auto flex w-full max-w-xl flex-col gap-4 py-2" hidden>
    <div class="flex flex-col gap-1">
      <h2 class="text-3xl font-extrabold leading-tight sm:text-4xl">How do you want to play?</h2>
      <p class="text-muted">Real dice rolls, every number equally likely.</p>
    </div>
    <div id="resumeRow"></div>
    <div id="modeCards" class="grid grid-cols-1 gap-3 sm:grid-cols-2"></div>
  </section>

  <!-- Setup for the chosen mode -->
  <section id="setupScreen" class="mx-auto flex w-full max-w-xl flex-col gap-4 rounded-2xl border border-line bg-panel p-4 sm:p-6" hidden></section>

  <!-- Game -->
  <div id="gameScreen" class="grid grid-cols-1 gap-3 lg:grid-cols-[minmax(0,1fr)_360px] lg:gap-6" hidden>

    <!-- Board with a name tag at each corner. Tag positions: 0 top-left, 1 top-right, 2 bottom-right, 3 bottom-left -->
    <div class="mx-auto flex w-full max-w-[min(100%,640px)] flex-col gap-2">
      <div class="grid grid-cols-2 gap-2">
        <div id="tag0"></div>
        <div id="tag1"></div>
      </div>
      <div class="aspect-square w-full rounded-xl bg-[#3b2a1c] p-1.5 shadow-[0_14px_30px_rgba(0,0,0,.45),inset_0_0_0_2px_#5a4029] sm:p-2.5">
        <svg id="board" viewBox="0 0 15 15" class="block h-full w-full touch-manipulation rounded-md" role="img" aria-label="Ludo board"></svg>
      </div>
      <div class="grid grid-cols-2 gap-2">
        <div id="tag3"></div>
        <div id="tag2"></div>
      </div>
    </div>

    <aside class="flex min-w-0 flex-col gap-3">
      <section id="turnCard" class="flex items-center gap-4 rounded-2xl border border-line bg-panel p-3 sm:p-4">
        <div class="flex min-w-0 flex-1 flex-col gap-1">
          <div class="flex items-center gap-2">
            <span id="turnSwatch" class="h-3 w-3 shrink-0 rounded-full bg-gold"></span>
            <span id="turnLabel" class="text-xs font-semibold uppercase tracking-widest text-muted">Waiting to start</span>
          </div>
          <div id="turnTitle" class="text-lg font-bold leading-tight sm:text-xl"></div>
          <div id="turnHint" class="min-h-[2.5rem] text-sm leading-snug text-muted"></div>
          <div id="turnActions" class="mt-1 flex flex-wrap gap-2"></div>
        </div>
      </section>

      <section class="flex flex-col gap-2.5 rounded-2xl border border-line bg-panel p-3 sm:p-4">
        <div class="flex items-center justify-between gap-2">
          <h2 class="text-xs font-semibold uppercase tracking-widest text-muted">Players</h2>
          <div id="lobbyActions" class="flex flex-wrap items-center justify-end gap-2 text-sm"></div>
        </div>
        <input id="nick" maxlength="16" placeholder="Your name" autocomplete="nickname" class="w-full rounded-lg border border-line bg-felt px-3 py-2 text-base text-ink placeholder:text-muted focus:outline-none focus:ring-2 focus:ring-gold" aria-label="Your name">
        <div id="pickWrap" class="flex flex-col gap-1.5">
          <div class="text-xs text-muted">Your color <span class="opacity-80">(only changes how the board looks on your phone)</span></div>
          <div id="colorPick" aria-label="Your color"></div>
        </div>
        <div id="joinRow" class="flex flex-wrap gap-2"></div>
        <ol id="playerList" class="flex flex-col gap-1.5"></ol>
      </section>

    </aside>
  </div>
</div>

<!-- Chat (online and friends games) -->
<div id="chatSheet" class="fixed inset-0 z-40 flex items-end justify-center bg-black/50 sm:items-center sm:p-4" role="dialog" aria-modal="true" aria-labelledby="chatTitle" hidden>
  <div class="flex max-h-[80vh] w-full max-w-md flex-col rounded-t-2xl border border-line bg-panel shadow-2xl sm:rounded-2xl" style="padding-bottom: env(safe-area-inset-bottom, 0px)">
    <div class="flex items-center justify-between gap-2 border-b border-line px-4 py-3">
      <h2 id="chatTitle" class="text-lg font-bold">Table chat</h2>
      <button id="chatClose" type="button" class="rounded-lg border border-line bg-felt2 px-3 py-1.5 text-sm font-bold active:scale-95 focus:outline-none focus-visible:ring-2 focus-visible:ring-gold">Close</button>
    </div>
    <ul id="chatList" class="flex min-h-[180px] flex-1 flex-col gap-2 overflow-y-auto px-4 py-3" aria-live="polite"></ul>
    <div id="chatQuick" class="flex gap-2 overflow-x-auto px-3 pb-2"></div>
    <form id="chatForm" class="flex gap-2 border-t border-line p-3" autocomplete="off">
      <input id="chatInput" maxlength="200" placeholder="Type a message" aria-label="Message" class="min-w-0 flex-1 rounded-lg border border-line bg-felt px-3 py-2 text-base text-ink placeholder:text-muted focus:outline-none focus:ring-2 focus:ring-gold">
      <button type="submit" class="rounded-lg bg-gold px-4 py-2 font-bold text-[#2a2208] active:scale-95 focus:outline-none focus-visible:ring-2 focus-visible:ring-ink">Send</button>
    </form>
  </div>
</div>
<script>
(() => {
  // ================================================================
  //  Constants
  // ================================================================
  // Internal seats ("slots"), clockwise around the board. Game logic always
  // works in slots; what colour a slot looks like is decided per viewer.
  const COLORS = ["red", "green", "yellow", "blue"];
  const CI = { red: 0, green: 1, yellow: 2, blue: 3 };
  const NAMES = { red: "Red", green: "Green", yellow: "Yellow", blue: "Blue" };
  const HEX = { red: "#d8382e", green: "#1d9a52", yellow: "#efb20a", blue: "#2563d4" };
  const LIGHT = { red: "#f4c7c3", green: "#bfe6cd", yellow: "#fbe7a8", blue: "#c3d4f6" };
  const START = { red: 0, green: 13, yellow: 26, blue: 39 };
  const SAFE = new Set([0, 8, 13, 21, 26, 34, 39, 47]);
  const FINISH = 56;
  const SLOTS_FOR = [[], ["red"], ["red", "yellow"], ["red", "green", "yellow"], ["red", "green", "yellow", "blue"]];
  const ONLINE_TURN_LIMIT = 30000;   // online: a player who doesn't act in 30s gets an automatic move
  const ONLINE_START_DELAY = 20000;  // online: game starts 20s after the 2nd player arrives
  const MODES = {
    online:   { title: "Play online",         desc: "Get matched with players from anywhere who are looking for a game.", chip: "Online" },
    computer: { title: "Play with computer",  desc: "You against 1 to 3 computer players.", chip: "Vs computer" },
    local:    { title: "Play on this device", desc: "2 to 4 players pass one phone around.", chip: "This device" },
    friends:  { title: "Play with friends",   desc: "Private room. Share a code or invite link.", chip: "Friends" },
  };
  const $ = id => document.getElementById(id);

  // ================================================================
  //  Fair dice: browser cryptographic randomness, bytes 252-255 discarded
  //  so each face 1-6 has exactly the same chance. No weighting, no memory.
  // ================================================================
  function rollDie() {
    const b = new Uint8Array(1);
    do { crypto.getRandomValues(b); } while (b[0] >= 252);
    return (b[0] % 6) + 1;
  }

  // ================================================================
  //  Board geometry
  // ================================================================
  const TRACK = [];
  const push = (r, c) => TRACK.push([r, c]);
  for (let c = 1; c <= 5; c++) push(6, c);
  for (let r = 5; r >= 0; r--) push(r, 6);
  push(0, 7);
  for (let r = 0; r <= 5; r++) push(r, 8);
  for (let c = 9; c <= 14; c++) push(6, c);
  push(7, 14);
  for (let c = 14; c >= 9; c--) push(8, c);
  for (let r = 9; r <= 14; r++) push(r, 8);
  push(14, 7);
  for (let r = 14; r >= 9; r--) push(r, 6);
  for (let c = 5; c >= 0; c--) push(8, c);
  push(7, 0);
  push(6, 0);
  const HOMECOL = {
    red: [1, 2, 3, 4, 5].map(c => [7, c]),
    green: [1, 2, 3, 4, 5].map(r => [r, 7]),
    yellow: [13, 12, 11, 10, 9].map(c => [7, c]),
    blue: [13, 12, 11, 10, 9].map(r => [r, 7]),
  };
  const YARD = { red: [0, 0], green: [0, 9], yellow: [9, 9], blue: [9, 0] };
  const FINISH_PT = { red: [6.55, 7.5], green: [7.5, 6.55], yellow: [8.45, 7.5], blue: [7.5, 8.45] };

  // ================================================================
  //  Identity & preferences (kept on this device)
  // ================================================================
  const lsGet = k => { try { return localStorage.getItem(k); } catch { return null; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
  const lsDel = k => { try { localStorage.removeItem(k); } catch {} };
  let myId = lsGet("ludo.cid");
  if (!myId) { myId = "c" + Math.random().toString(36).slice(2, 10); lsSet("ludo.cid", myId); }
  try { const p = new URLSearchParams(location.search).get("p"); if (p && /^[a-z0-9]{1,16}$/i.test(p)) myId = "t" + p; } catch {}
  let pref = lsGet("ludo.pref");
  if (!COLORS.includes(pref)) pref = "red";
  const savedNick = () => lsGet("ludo.nick") || "";
  const myNick = () => (lsGet("ludo.nick") || "").trim() || "Player";
  const nickEl = $("nick");

  // ================================================================
  //  State
  // ================================================================
  const freshTokens = () => ({ red: [-1, -1, -1, -1], green: [-1, -1, -1, -1], yellow: [-1, -1, -1, -1], blue: [-1, -1, -1, -1] });
  const freshState = () => ({ phase: "lobby", players: [], seats: {}, tokens: freshTokens(), turn: null, roll: null, sixes: 0, winners: [], last: null, startAt: null, turnAt: 0, log: [{ c: "", t: "Table is set." }] });

  let mode = null;          // online | computer | local | friends
  let state = freshState();
  let online = false, loaded = false, rolling = false, seenSeq = null, confirmReset = false, confirmMenu = false;
  let autoJoin = false;     // join as soon as the room's state arrives
  let searching = false, searchN = 0;
  const isNet = () => mode === "online" || mode === "friends";
  const newCode = () => Math.random().toString(36).slice(2, 8);
  let room = null;

  const clone = o => JSON.parse(JSON.stringify(o));
  const seated = s => COLORS.filter(c => s.seats[c]);
  const seatName = (s, c) => (s.seats[c] && s.seats[c].nick) || NAMES[c];
  const addLog = (s, c, t) => { s.log = [{ c, t }, ...(s.log || [])].slice(0, 20); };
  const joined = s => s.players.some(p => p.id === myId);
  const seatsFor = players => {
    const out = {};
    (SLOTS_FOR[players.length] || []).forEach((slot, i) => { out[slot] = { id: players[i].id, nick: players[i].nick }; });
    return out;
  };
  // Can this device act for seat c?
  function mine(s, c) {
    const st = s.seats[c];
    if (!st || st.bot) return false;
    return isNet() ? st.id === myId : true;
  }
  // Does this device run computer players and automatic moves?
  const controller = () => !isNet() || isHost;

  // ================================================================
  //  What this viewer sees
  // ================================================================
  // The slot that belongs to me (my corner): only in online/friends after
  // joining, and in vs-computer mode. Local play keeps the board still.
  function mySlot() {
    if (isNet()) return COLORS.find(c => state.seats[c] && state.seats[c].id === myId) || null;
    if (mode === "computer") return COLORS.find(c => state.seats[c] && state.seats[c].id === "me") || null;
    return null;
  }
  // In online/friends play, my slot is painted in my chosen colour and the
  // other slots follow the normal colour order clockwise from it.
  function displayColor(slot) {
    const me = isNet() ? mySlot() : null;
    if (!me) return slot;
    return COLORS[(CI[pref] + (CI[slot] - CI[me] + 4)) % 4];
  }
  const targetTurns = () => { const s = mySlot(); return s ? (3 - CI[s] + 4) % 4 : 0; };
  const dHex = slot => HEX[displayColor(slot)];

  // ================================================================
  //  Rules
  // ================================================================
  const canMove = (p, v) => p !== FINISH && (p === -1 ? v === 6 : p + v <= FINISH);
  const movable = (s, c, v) => s.tokens[c].map((p, i) => canMove(p, v) ? i : -1).filter(i => i >= 0);
  const trackIdx = (c, p) => (START[c] + p) % 52;

  function nextTurn(s) {
    s.roll = null; s.sixes = 0;
    const active = seated(s).filter(c => !s.winners.includes(c));
    if (active.length <= 1) {
      if (active.length === 1) s.winners.push(active[0]);
      s.phase = "done"; s.turn = null;
      addLog(s, "", "Game over.");
      return;
    }
    const i = CI[s.turn];
    for (let k = 1; k <= 4; k++) {
      const c = COLORS[(i + k) % 4];
      if (active.includes(c)) { s.turn = c; return; }
    }
  }

  function wouldCapture(s, c, np) {
    if (np > 50) return false;
    const idx = trackIdx(c, np);
    if (SAFE.has(idx)) return false;
    return COLORS.some(o => o !== c && s.tokens[o].some(op => op >= 0 && op <= 50 && trackIdx(o, op) === idx));
  }

  function applyMove(s, c, i, v) {
    const p = s.tokens[c][i];
    const np = p === -1 ? 0 : p + v;
    s.tokens[c][i] = np;
    s.roll = null;
    const captured = [];
    if (np <= 50) {
      const idx = trackIdx(c, np);
      if (!SAFE.has(idx)) {
        for (const o of COLORS) {
          if (o === c) continue;
          s.tokens[o].forEach((op, j) => {
            if (op >= 0 && op <= 50 && trackIdx(o, op) === idx) { s.tokens[o][j] = -1; captured.push(o); }
          });
        }
      }
    }
    const who = seatName(s, c);
    if (p === -1) addLog(s, c, `${who} brought a token out.`);
    else if (np === FINISH) addLog(s, c, `${who} got a token home!`);
    else addLog(s, c, `${who} moved ${v}.`);
    if (captured.length) addLog(s, c, `${who} cut ${[...new Set(captured)].map(o => seatName(s, o)).join(" & ")}!`);
    if (s.tokens[c].every(t => t === FINISH)) {
      s.winners.push(c);
      addLog(s, c, `${who} finished in place ${s.winners.length}!`);
      nextTurn(s);
      return;
    }
    if (v === 6 || captured.length || np === FINISH) addLog(s, c, `${who} plays again.`);
    else nextTurn(s);
  }

  // Simple computer strategy: finish > capture > bring out > reach safety > advance furthest.
  function chooseMove(s, c, v) {
    let best = -1, bestScore = -Infinity;
    for (const i of movable(s, c, v)) {
      const p = s.tokens[c][i], np = p === -1 ? 0 : p + v;
      let sc = np * 0.5;
      if (np === FINISH) sc += 100;
      if (wouldCapture(s, c, np)) sc += 80;
      if (p === -1) sc += 60;
      if (np > 50 && p <= 50) sc += 30;
      if (np <= 50 && SAFE.has(trackIdx(c, np))) sc += 15;
      sc += Math.random();
      if (sc > bestScore) { bestScore = sc; best = i; }
    }
    return best;
  }

  // ================================================================
  //  Commit: every change goes through here
  // ================================================================
  function commit(mutate) {
    if (!loaded) return;
    const s = clone(state);
    if (mutate(s) === false) return;
    s.v = (state.v || 0) + 1;
    if (s.turn !== state.turn || s.roll !== state.roll || (s.last && s.last.seq) !== (state.last && state.last.seq) || s.phase !== state.phase) s.turnAt = Date.now();
    state = s;
    persist();
    render();
    if (isNet()) broadcast();
  }

  function persist() {
    if (isNet()) { if (room) lsSet("ludo2.room." + room, JSON.stringify(state)); }
    else if (mode) lsSet("ludo.saved", JSON.stringify({ mode, state }));
  }

  // ---------- roll & move (permission checked by callers) ----------
  function doRoll(c) {
    if (rolling || state.phase !== "playing" || state.turn !== c || state.roll) return;
    const v = rollDie();
    rolling = true; rollColor = c;
    animateDie(v, () => {
      rolling = false;
      holdDie(c);
      commit(s => {
        if (s.phase !== "playing" || s.turn !== c || s.roll) return false;
        const seq = ((s.last && s.last.seq) || 0) + 1;
        s.last = { v, c, seq };
        seenSeq = seq;
        const who = seatName(s, c);
        addLog(s, c, `${who} rolled ${v}.`);
        if (v === 6 && (s.sixes || 0) >= 2) { addLog(s, c, `Third 6 in a row. Turn passes.`); nextTurn(s); return; }
        s.sixes = v === 6 ? (s.sixes || 0) + 1 : 0;
        const opts = movable(s, c, v);
        if (!opts.length) { addLog(s, c, `No move possible.`); nextTurn(s); return; }
        if (new Set(opts.map(i => s.tokens[c][i])).size === 1) { applyMove(s, c, opts[0], v); return; }
        s.roll = v;
      });
      render();
    });
    render();
  }
  function doMove(c, i) {
    commit(s => {
      if (s.phase !== "playing" || s.turn !== c || !s.roll) return false;
      if (!canMove(s.tokens[c][i], s.roll)) return false;
      applyMove(s, c, i, s.roll);
    });
  }
  // One step for a computer player (or an automatic move for an idle online player)
  function autoStep() {
    const s = state;
    if (s.phase !== "playing" || rolling) return;
    const c = s.turn;
    if (!s.roll) doRoll(c);
    else { const i = chooseMove(s, c, s.roll); if (i >= 0) doMove(c, i); }
  }

  let botTimer = null;
  function tickBots() {
    if (botTimer || !loaded || !controller() || state.phase !== "playing" || rolling) return;
    const st = state.seats[state.turn];
    if (!st || !st.bot) return;
    botTimer = setTimeout(() => { botTimer = null; if (state.seats[state.turn] && state.seats[state.turn].bot) autoStep(); }, state.roll ? 650 : 900);
  }

  const canRollNow = () => loaded && !rolling && state.phase === "playing" && !state.roll && mine(state, state.turn);

  // ---------- lobby (online / friends) ----------
  function hostJoin(id, nick) {
    commit(s => {
      if (s.phase !== "lobby") return false;
      const ex = s.players.find(p => p.id === id);
      if (ex) { if (ex.nick === nick) return false; ex.nick = nick; }
      else { if (s.players.length >= 4) return false; s.players.push({ id, nick }); addLog(s, "", `${nick} joined.`); }
      s.seats = seatsFor(s.players);
      if (mode === "online") {
        if (s.players.length >= 2 && !s.startAt) s.startAt = Date.now() + ONLINE_START_DELAY;
        if (s.players.length === 4) s.startAt = Math.min(s.startAt || Infinity, Date.now() + 3000);
      }
    });
  }
  function hostLeave(id) {
    commit(s => {
      if (s.phase !== "lobby") return false;
      const me = s.players.find(p => p.id === id);
      if (!me) return false;
      s.players = s.players.filter(p => p.id !== id);
      s.seats = seatsFor(s.players);
      if (s.players.length < 2) s.startAt = null;
      addLog(s, "", `${me.nick} left.`);
    });
  }
  function startGame() {
    commit(s => {
      if (s.phase !== "lobby" || s.players.length < 2) return false;
      s.seats = seatsFor(s.players);
      Object.assign(s, { phase: "playing", tokens: freshTokens(), winners: [], roll: null, sixes: 0, turn: seated(s)[0], last: null, startAt: null });
      addLog(s, "", `Game on! ${seatName(s, s.turn)} goes first.`);
    });
  }

  const actions = {
    join() {
      if (isHost || !online) hostJoin(myId, myNick());
      else if (hostConn && hostConn.open) hostConn.send({ type: "join", id: myId, nick: myNick() });
    },
    leave() {
      if (isHost || !online) hostLeave(myId);
      else if (hostConn && hostConn.open) hostConn.send({ type: "leave", id: myId });
    },
    start() { if (isHost || !isNet()) startGame(); else if (hostConn && hostConn.open) hostConn.send({ type: "start" }); },
    roll() { if (canRollNow()) doRoll(state.turn); },
    move(c, i) { if (state.phase === "playing" && state.turn === c && mine(state, c)) doMove(c, i); },
    reset() {
      confirmReset = false;
      commit(s => {
        const { players, seats } = s;
        Object.assign(s, freshState(), { players, seats });
        if (isNet()) s.seats = seatsFor(players);
        else { s.phase = "playing"; s.turn = seated(s)[0]; }
        s.log = [{ c: "", t: isNet() ? "New game. Press Start when ready." : `New game. ${seatName(s, s.turn)} goes first.` }];
      });
    },
    clearSeats() { confirmReset = false; commit(s => { Object.assign(s, freshState()); }); },
  };

  // ================================================================
  //  Dice
  // ================================================================
  const PIP_CELLS = { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };
  const dieEl = document.createElement("button");
  dieEl.id = "die";
  dieEl.type = "button";
  dieEl.className = "die-face grid aspect-square w-12 shrink-0 grid-cols-3 grid-rows-3 place-items-center rounded-xl bg-paper p-1.5 disabled:cursor-default min-[400px]:w-14 sm:w-16 focus:outline-none focus-visible:ring-4 focus-visible:ring-gold";
  let shownFace = 1;
  let rollColor = null, holdColor = null, holdUntil = 0;
  // After a roll the dice stays with the roller only long enough to read the
  // number, then moves to the next player.
  function holdDie(c) { holdColor = c; holdUntil = Date.now() + 450; setTimeout(render, 480); }
  function drawFace(v) {
    shownFace = v;
    const cells = PIP_CELLS[v] || [];
    let html = "";
    for (let k = 0; k < 9; k++) html += cells.includes(k) ? `<span class="block h-[70%] w-[70%] rounded-full" style="background:#23302c"></span>` : `<span></span>`;
    dieEl.innerHTML = html;
  }
  const reduceMotion = () => window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  function animateDie(finalV, done) {
    dieEl.classList.remove("rolling", "ready");
    void dieEl.offsetWidth;
    dieEl.classList.add("rolling");
    const reduce = reduceMotion();
    let n = 0;
    const iv = setInterval(() => {
      let f; do { f = 1 + Math.floor(Math.random() * 6); } while (f === shownFace);
      drawFace(f);
      if (++n >= 8 || reduce) {
        clearInterval(iv);
        drawFace(finalV);
        setTimeout(() => { dieEl.classList.remove("rolling"); done && done(); }, reduce ? 0 : 120);
      }
    }, 65);
    try { navigator.vibrate && navigator.vibrate(30); } catch {}
  }
  dieEl.addEventListener("click", () => actions.roll());
  drawFace(1);

  // ================================================================
  //  Board drawing
  // ================================================================
  const NS = "http://www.w3.org/2000/svg";
  const svg = $("board");
  const rot = document.createElementNS(NS, "g");
  svg.appendChild(rot);
  const el = (tag, attrs, parent) => { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); (parent || rot).appendChild(n); return n; };
  const painted = [];
  const paint = (node, slot, attr, tone) => { painted.push({ node, slot, attr, tone }); return node; };
  let paintedKey = "";
  function repaint() {
    const key = COLORS.map(displayColor).join(",");
    if (key === paintedKey) return;
    paintedKey = key;
    for (const p of painted) p.node.setAttribute(p.attr, (p.tone === "light" ? LIGHT : HEX)[displayColor(p.slot)]);
  }
  function star(cx, cy, fill) {
    const pts = [];
    for (let k = 0; k < 10; k++) {
      const a = -Math.PI / 2 + k * Math.PI / 5, rr = k % 2 ? .15 : .34;
      pts.push((cx + rr * Math.cos(a)).toFixed(3) + "," + (cy + rr * Math.sin(a)).toFixed(3));
    }
    el("polygon", { points: pts.join(" "), fill, stroke: "#23302c", "stroke-width": .03 });
  }
  (function drawBoard() {
    el("rect", { x: 0, y: 0, width: 15, height: 15, fill: "#f7f2e3" });
    for (const c of COLORS) {
      const [r0, c0] = YARD[c];
      paint(el("rect", { x: c0, y: r0, width: 6, height: 6 }), c, "fill");
      el("rect", { x: c0 + .8, y: r0 + .8, width: 4.4, height: 4.4, rx: .5, fill: "#f7f2e3" });
      for (const [dy, dx] of [[2, 2], [2, 4], [4, 2], [4, 4]]) {
        const ci = el("circle", { cx: c0 + dx, cy: r0 + dy, r: .62, "stroke-width": .06 });
        paint(ci, c, "fill", "light"); paint(ci, c, "stroke");
      }
    }
    TRACK.forEach(([r, c], idx) => {
      const sq = el("rect", { x: c, y: r, width: 1, height: 1, fill: "#fffdf6", stroke: "#23302c", "stroke-width": .035 });
      for (const col of COLORS) if (START[col] === idx) paint(sq, col, "fill");
      if (SAFE.has(idx)) star(c + .5, r + .5, [0, 13, 26, 39].includes(idx) ? "#fffdf6" : "#9aa59f");
    });
    for (const c of COLORS) HOMECOL[c].forEach(([r, cc]) => paint(el("rect", { x: cc, y: r, width: 1, height: 1, stroke: "#23302c", "stroke-width": .035 }), c, "fill"));
    paint(el("polygon", { points: "6,6 6,9 7.5,7.5" }), "red", "fill");
    paint(el("polygon", { points: "6,6 9,6 7.5,7.5" }), "green", "fill");
    paint(el("polygon", { points: "9,6 9,9 7.5,7.5" }), "yellow", "fill");
    paint(el("polygon", { points: "6,9 9,9 7.5,7.5" }), "blue", "fill");
    el("rect", { x: 6, y: 6, width: 3, height: 3, fill: "none", stroke: "#23302c", "stroke-width": .05 });
    el("rect", { x: 0, y: 0, width: 15, height: 15, fill: "none", stroke: "#23302c", "stroke-width": .08 });
  })();

  const tokenLayer = el("g", {});
  const tokenEls = {};
  for (const c of COLORS) for (let i = 0; i < 4; i++) {
    const g = el("g", { class: "token", tabindex: "-1" }, tokenLayer);
    el("circle", { r: .62, fill: "transparent" }, g);
    el("circle", { class: "halo", r: .5, fill: "none", stroke: "#f2c94c", "stroke-width": .13 }, g);
    el("ellipse", { cx: .03, cy: .1, rx: .34, ry: .3, fill: "rgba(0,0,0,.28)" }, g);
    paint(el("circle", { r: .34, stroke: "#1b1b1b", "stroke-width": .05 }, g), c, "fill");
    el("circle", { r: .17, fill: "rgba(255,255,255,.85)" }, g);
    paint(el("circle", { r: .09 }, g), c, "fill");
    g.addEventListener("click", () => { try { g.blur(); } catch {} actions.move(c, i); });
    g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); actions.move(c, i); } });
    tokenEls[c + i] = g;
  }

  // Board rotation: turns (with an animation) only when the seat that is
  // mine changes, i.e. when I join. Picking a colour never turns it.
  let curAngle = 0, rotTarget = 0, rotReady = false;
  const applyRot = () => rot.setAttribute("transform", curAngle ? `rotate(${curAngle} 7.5 7.5)` : "");
  function updateRotation() {
    const t = targetTurns() * 90;
    if (rotReady && t === rotTarget) return;
    const instant = !rotReady || reduceMotion();
    rotReady = true; rotTarget = t;
    if (instant) { curAngle = t; applyRot(); return; }
    const from = curAngle, d = ((t - from) % 360 + 540) % 360 - 180;
    const t0 = performance.now();
    const step = now => {
      if (rotTarget !== t) return;
      const p = Math.min(1, (now - t0) / 900);
      const e = p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
      curAngle = from + d * e; applyRot();
      if (p < 1) requestAnimationFrame(step); else { curAngle = ((t % 360) + 360) % 360; applyRot(); }
    };
    requestAnimationFrame(step);
  }

  function basePoint(c, i, p) {
    if (p === -1) { const [r0, c0] = YARD[c]; const d = [[2, 2], [2, 4], [4, 2], [4, 4]][i]; return { x: c0 + d[1], y: r0 + d[0], key: "y" + c + i }; }
    if (p <= 50) { const [r, cc] = TRACK[trackIdx(c, p)]; return { x: cc + .5, y: r + .5, key: "t" + trackIdx(c, p) }; }
    if (p < FINISH) { const [r, cc] = HOMECOL[c][p - 51]; return { x: cc + .5, y: r + .5, key: "h" + c + p }; }
    const [x, y] = FINISH_PT[c]; return { x, y, key: "f" + c };
  }

  function renderTokens() {
    const groups = {};
    for (const c of COLORS) state.tokens[c].forEach((p, i) => {
      const b = basePoint(c, i, p);
      (groups[b.key] = groups[b.key] || []).push({ c, i, b });
    });
    const moveSet = new Set(state.phase === "playing" && state.roll && mine(state, state.turn) ? movable(state, state.turn, state.roll).map(i => state.turn + i) : []);
    for (const key in groups) {
      const list = groups[key], n = list.length;
      list.forEach((t, k) => {
        let { x, y } = t.b, s = 1;
        if (n > 1) {
          s = n > 2 ? .62 : .75;
          const off = n > 2 ? .22 : .2, ang = (k / n) * Math.PI * 2 - Math.PI / 4;
          x += Math.cos(ang) * off; y += Math.sin(ang) * off;
        }
        const g = tokenEls[t.c + t.i];
        g.style.transform = `translate(${x}px,${y}px) scale(${s})`;
        g.style.display = state.seats[t.c] ? "" : "none";
        const isMov = moveSet.has(t.c + t.i);
        g.classList.toggle("movable", isMov);
        g.setAttribute("tabindex", isMov ? "0" : "-1");

      });
    }
  }

  // ================================================================

  const mk = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };

  }
  function fixLocalColors() {
    const used = new Set();
    for (let k = 0; k < localSetup.count; k++) {
      const r = localSetup.rows[k];
      if (used.has(r.color)) r.color = COLORS.find(c => !used.has(c));
      used.add(r.color);
    }
  }

  // ---------- starting each mode ----------
  function startOffline(s, animateRotation) {
    state = s; loaded = true; online = false; seenSeq = s.last ? s.last.seq : 0; confirmReset = false; confirmMenu = false;
    if (animateRotation) { rotReady = true; rotTarget = 0; curAngle = 0; applyRot(); } else rotReady = false;
    persist();
    showScreen("game");
    showBanner("");
    render();
  }
  function startComputer(count) {
    const human = pref;
    const hi = CI[human];
    const offsets = { 2: [0, 2], 3: [0, 1, 2], 4: [0, 1, 2, 3] }[count];
    const s = freshState();
    let bot = 0;
    offsets.forEach(o => {
      const slot = COLORS[(hi + o) % 4];
      s.seats[slot] = o === 0 ? { id: "me", nick: myNick() } : { id: "bot" + (++bot), nick: `Computer ${bot}`, bot: true };
    });
    s.players = seated(s).map(c => ({ id: s.seats[c].id, nick: s.seats[c].nick }));
    s.phase = "playing"; s.turn = human; s.turnAt = Date.now();
    s.log = [{ c: "", t: `Game on! ${myNick()} goes first.` }];
    mode = "computer";
    startOffline(s, true); // my corner animates to the bottom-left
  }
  function startLocal() {
    fixLocalColors();
    const s = freshState();
    const rows = localSetup.rows.slice(0, localSetup.count);
    rows.forEach((r, k) => { s.seats[r.color] = { id: "L" + (k + 1), nick: r.name.trim() || `Player ${k + 1}` }; });
    s.players = seated(s).map(c => ({ id: s.seats[c].id, nick: s.seats[c].nick }));
    s.phase = "playing"; s.turn = seated(s)[0]; s.turnAt = Date.now();
    s.log = [{ c: "", t: `Game on! ${seatName(s, s.turn)} goes first.` }];
    mode = "local";
    startOffline(s);
  }
  function startOnline() {
    mode = "online";
    if (!window.Peer) { showBanner("Online play needs an internet connection. Check it and reload the page."); return; }
    showScreen("game");
    autoJoin = true; searching = true;
    findGame(0);
  }
  function findGame(n) {
    if (n > 40) { searching = false; showBanner("Couldn't find a free table right now. Try again in a minute."); return; }
    searchN = n; searching = true; autoJoin = true;
    openRoom("pub" + n);
  }
  function startFriends(code) {
    mode = "friends";
    if (!window.Peer) { showBanner("Playing with friends needs an internet connection. Check it and reload the page."); return; }
    showScreen("game");
    autoJoin = true;
    openRoom(code);
  }

  // Leave whatever is running (network rooms, timers)
  function leaveCurrent() {
    if (isNet() && loaded && state.phase === "lobby" && joined(state)) { try { actions.leave(); } catch {} }
    teardown();
    clearTimeout(botTimer); botTimer = null;
    online = false; loaded = false; searching = false; autoJoin = false; room = null;
    rotReady = false; rotTarget = 0; curAngle = 0; applyRot(); paintedKey = "";
    state = freshState();
    resetChat();
    try { if (location.hash) history.replaceState(null, "", location.pathname + location.search); } catch {}
  }

  // ================================================================
  //  Game screen panel
  // ================================================================
  const pickEl = $("colorPick");
  nickEl.value = savedNick();
  let renameTimer = null;
  nickEl.addEventListener("input", () => {
    lsSet("ludo.nick", nickEl.value.trim());
    clearTimeout(renameTimer);
    renameTimer = setTimeout(() => { if (isNet() && joined(state) && state.phase === "lobby") actions.join(); }, 600);
  });

  // Rebuild a block only when what it shows has changed, so buttons are not
  // replaced under the player's finger while timers refresh the panel.
  function keyed(el, key, build) { if (el._key === key) return; el._key = key; el.innerHTML = ""; build(); }

  function secsLeft(at) { return Math.max(0, Math.ceil((at - Date.now()) / 1000)); }

  function renderPanel() {
    const s = state;
    const title = $("turnTitle"), hint = $("turnHint"), label = $("turnLabel"), sw = $("turnSwatch"), acts = $("turnActions");
    const actKey = [loaded, s.phase, joined(s), s.players.length, mode].join("|");
    const buildActs = acts._key !== actKey;
    if (buildActs) { acts._key = actKey; acts.innerHTML = ""; }
    const canRoll = canRollNow();
    dieEl.disabled = !canRoll;
    dieEl.classList.toggle("ready", canRoll);
    dieEl.setAttribute("aria-label", canRoll ? "Roll the dice" : "Dice");

    if (!loaded) {
      label.textContent = searching ? "Finding a table" : "Connecting";
      title.textContent = searching ? "Looking for players…" : "Setting up the table";
      hint.textContent = ""; sw.style.background = "#2c5a51";
    } else if (s.phase === "lobby") {
      const n = s.players.length;
      sw.style.background = HEX[pref];
      label.textContent = mode === "online" ? "Public table" : "Waiting to start";
      if (!joined(s)) {
        title.textContent = n >= 4 ? "This table is full" : "Join the game";
        hint.textContent = "Type your name, pick your color and tap Join game.";
      } else if (n < 2) {
        title.textContent = mode === "online" ? "Waiting for another player…" : "Waiting for friends";
        hint.textContent = mode === "online" ? "Anyone who taps Play online right now will join you here." : "Tap Invite and send the link. Each friend joins on their own phone.";
      } else {
        title.textContent = `${n} players ready`;
        hint.textContent = mode === "online" && s.startAt ? `Starting in ${secsLeft(s.startAt)}s. More players can still join.` : "Anyone at the table can press Start.";
      }
      if (joined(s) && buildActs) {
        const st = mk("button", BTN_PRIMARY, "Start game");
        st.disabled = n < 2;
        st.addEventListener("click", actions.start);
        acts.appendChild(st);
      }
    } else if (s.phase === "playing") {
      const c = s.turn, me = mine(s, c), st = s.seats[c];
      sw.style.background = dHex(c);
      const nm = seatName(s, c);
      label.textContent = mode === "local" ? `${nm}'s turn` : me ? "Your turn" : `${nm}'s turn`;
      if (rolling) { title.textContent = me && mode !== "local" ? "Rolling…" : `${nm} is rolling…`; hint.textContent = ""; }
      else if (me) {
        const who = mode === "local" ? `${nm}, ` : "";
        if (s.roll) { title.textContent = `${mode === "local" ? nm : "You"} rolled ${s.roll}`; hint.textContent = "Tap a glowing token to move it."; }
        else { title.textContent = `${who}tap your dice to roll`.replace(/^t/, "T"); hint.textContent = s.last && s.last.c !== c ? `${seatName(s, s.last.c)} rolled ${s.last.v}.` : "Roll a 6 to bring a token out."; }
        if (mode === "online") hint.textContent += ` ${secsLeft(turnSeenAt + ONLINE_TURN_LIMIT)}s left.`;
      } else {
        title.textContent = s.roll ? `${nm} rolled ${s.roll}` : `${nm} is up`;
        hint.textContent = st && st.bot ? "The computer is thinking." : s.roll ? "Waiting for them to move." : "Waiting for them to roll.";
      }
    } else {
      sw.style.background = s.winners[0] ? dHex(s.winners[0]) : "#f2c94c";
      label.textContent = "Game over";
      title.textContent = s.winners[0] ? `${seatName(s, s.winners[0])} wins!` : "Game over";
      hint.textContent = s.winners.map((c, k) => `${k + 1}. ${seatName(s, c)}`).join("   ");
      if (buildActs) {
        const again = mk("button", BTN_PRIMARY, mode === "online" ? "Find another game" : "Play again");
        again.addEventListener("click", () => { if (mode === "online") { leaveCurrent(); startOnline(); } else actions.reset(); });
        acts.appendChild(again);
      }
    }

    // name + colour (online/friends only)
    const net = isNet();
    nickEl.hidden = !(net && s.phase === "lobby" && loaded);
    $("pickWrap").hidden = !net || !loaded;
    keyed(pickEl, net + pref, () => { if (net) pickEl.appendChild(colorButtons(pref, c => { pref = c; lsSet("ludo.pref", c); render(); })); });

    // join / leave
    const jr = $("joinRow");
    keyed(jr, [net, loaded, s.phase, joined(s), s.players.length, mode, !!mySlot()].join("|"), () => {
    if (net && loaded && s.phase === "lobby") {
      if (!joined(s)) {
        const b = mk("button", BTN_PRIMARY + " flex-1 !py-2.5 text-base", s.players.length >= 4 ? "Table is full" : "Join game");
        b.disabled = s.players.length >= 4;
        b.addEventListener("click", actions.join);
        jr.appendChild(b);
      } else if (mode === "friends") {
        const b = mk("button", BTN_GHOST, "Leave");
        b.addEventListener("click", actions.leave);
        jr.appendChild(b);
      }
    } else if (net && loaded && !mySlot()) {
      jr.appendChild(mk("div", "text-sm text-muted", "You're watching this game. You can join the next one."));
    }
    });

    // player list
    const pl = $("playerList");
    const list = s.phase === "lobby" ? s.players.map(p => ({ p, slot: COLORS.find(c => s.seats[c] && s.seats[c].id === p.id) }))
      : seated(s).map(c => ({ p: s.seats[c], slot: c }));
    keyed(pl, JSON.stringify([list, s.winners, s.phase, joined(s), COLORS.map(displayColor)]), () => {
    if (!list.length) pl.appendChild(mk("li", "text-sm text-muted", "No one has joined yet."));
    list.forEach(({ p, slot }, k) => {
      const li = mk("li", "flex min-w-0 items-center gap-2 rounded-lg bg-felt/60 px-2.5 py-2 text-sm");
      const dot = mk("span", "h-3 w-3 shrink-0 rounded-full");
      dot.style.background = slot && (s.phase !== "lobby" || joined(s) || !net) ? dHex(slot) : "#a9c3ba";
      const you = (net && p.id === myId) || (mode === "computer" && p.id === "me");
      li.append(dot, mk("span", "min-w-0 flex-1 truncate font-bold", p.nick + (you ? " (you)" : "")));
      const place = slot ? s.winners.indexOf(slot) : -1;
      li.appendChild(mk("span", "shrink-0 text-xs text-muted", place >= 0 ? `#${place + 1}` : (s.seats[slot] && s.seats[slot].bot) ? "Computer" : `P${k + 1}`));
      pl.appendChild(li);
    });
    });

    // end game / clear table
    const la = $("lobbyActions");
    keyed(la, [loaded, mode, s.phase, confirmReset, s.players.length].join("|"), () => {
    if (loaded && mode !== "online") {
      const playing = s.phase === "playing";
      if (!confirmReset) {
        if (playing || (mode === "friends" && s.players.length)) {
          const b = mk("button", BTN_DANGER + " !px-2 !py-1 text-xs", playing ? "Restart" : "Clear table");
          b.addEventListener("click", () => { confirmReset = true; render(); });
          la.appendChild(b);
        }
      } else {
        la.appendChild(mk("span", "text-xs text-muted", playing ? "Restart for everyone?" : "Remove everyone?"));
        const yes = mk("button", BTN_DANGER + " !px-2 !py-1 text-xs", "Yes");
        yes.addEventListener("click", playing ? actions.reset : actions.clearSeats);
        const no = mk("button", BTN_GHOST + " !px-2 !py-1 text-xs", "No");
        no.addEventListener("click", () => { confirmReset = false; render(); });
        la.append(yes, no);
      }
    }
    });

    // The turn box is only for before and after a game; during play the
    // corner name tags show whose turn it is.
    $("turnCard").hidden = loaded && s.phase === "playing";
    $("roomCode").textContent = room || "------";
    $("menuBtn").textContent = confirmMenu ? "Leave game?" : "Menu";
  }

  // ---------- chat (online / friends) ----------
  // Messages travel separately from the game state so a chat line can never
  // overwrite a move. The host keeps the last 40 and relays every message.
  let chat = [], unread = 0, chatOpen = false;
  const bubbles = {};
  const QUICK = ["👋 Hi!", "Good luck!", "Nice move!", "Hurry up! ⏳", "Oops 😅", "Good game!"];
  const chatSheet = $("chatSheet"), chatList = $("chatList"), chatInput = $("chatInput");

  function addChat(m, quiet) {
    if (!m || typeof m.text !== "string" || typeof m.mid !== "string") return false;
    if (chat.some(x => x.mid === m.mid)) return false;
    const msg = { mid: m.mid.slice(0, 64), id: String(m.id || "").slice(0, 40), nick: String(m.nick || "Player").slice(0, 16), text: m.text.trim().slice(0, 200), ts: Number(m.ts) || Date.now() };
    if (!msg.text) return false;
    chat.push(msg);
    chat = chat.slice(-40);
    if (!quiet) {
      if (msg.id !== myId && !chatOpen) unread++;
      if (msg.id !== myId) { try { navigator.vibrate && navigator.vibrate(20); } catch {} }
      bubbles[msg.id] = { text: msg.text, until: Date.now() + 4500 };
      setTimeout(render, 4600);
    }
    renderChat();
    render();
    return true;
  }
  function sendChat(text) {
    text = String(text || "").trim().slice(0, 200);
    if (!text || !isNet() || !online) return;
    const m = { type: "chat", mid: myId + "-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), id: myId, nick: myNick(), text, ts: Date.now() };
    addChat(m);
    if (isHost) conns.forEach(c => { if (c.open) c.send(m); });
    else if (hostConn && hostConn.open) hostConn.send(m);
  }
  function renderChat() {
    chatList.innerHTML = "";
    if (!chat.length) chatList.appendChild(mk("li", "my-auto text-center text-sm text-muted", "No messages yet. Say hi!"));
    for (const m of chat) {
      const me = m.id === myId;
      const slot = COLORS.find(c => state.seats[c] && state.seats[c].id === m.id);
      const li = mk("li", "flex max-w-[85%] flex-col gap-0.5 " + (me ? "self-end items-end" : "self-start items-start"));
      const who = mk("div", "flex items-center gap-1.5 text-xs font-semibold text-muted");
      const dot = mk("span", "h-2 w-2 rounded-full"); dot.style.background = slot ? dHex(slot) : "#a9c3ba";
      who.append(dot, mk("span", "", me ? "You" : m.nick));
      const body = mk("div", "break-words rounded-2xl px-3 py-2 text-sm " + (me ? "bg-gold text-[#2a2208]" : "bg-felt2 text-ink"), m.text);
      li.append(who, body);
      chatList.appendChild(li);
    }
    chatList.scrollTop = chatList.scrollHeight;
  }
  function openChat() {
    chatOpen = true; unread = 0;
    chatSheet.hidden = false;
    renderChat(); render();
    setTimeout(() => { try { chatInput.focus(); } catch {} }, 50);
  }
  function closeChat() { chatOpen = false; chatSheet.hidden = true; render(); }
  $("chatClose").addEventListener("click", closeChat);
  chatSheet.addEventListener("click", e => { if (e.target === chatSheet) closeChat(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && chatOpen) closeChat(); });
  $("chatForm").addEventListener("submit", e => { e.preventDefault(); sendChat(chatInput.value); chatInput.value = ""; chatInput.focus(); });
  for (const q of QUICK) {
    const b = mk("button", "shrink-0 rounded-full border border-line bg-felt2 px-3 py-1 text-sm font-semibold active:scale-95 focus:outline-none focus-visible:ring-2 focus-visible:ring-gold", q);
    b.type = "button";
    b.addEventListener("click", () => sendChat(q));
    $("chatQuick").appendChild(b);
  }
  function resetChat() { chat = []; unread = 0; for (const k in bubbles) delete bubbles[k]; chatOpen = false; chatSheet.hidden = true; renderChat(); }

  // ---------- corner name tags ----------
  const tags = [0, 1, 2, 3].map(pos => {
    const t = $("tag" + pos);
    const right = pos === 1 || pos === 2;
    const top = pos === 0 || pos === 1;
    t.className = "relative flex min-w-0 items-center gap-2 rounded-xl border-2 p-2 transition-colors " + (right ? "flex-row-reverse text-right" : "");
    const info = mk("div", "flex min-w-0 flex-1 flex-col gap-0.5" + (right ? " items-end" : ""));
    const line = mk("div", "flex min-w-0 max-w-full items-center gap-1.5 font-bold leading-tight" + (right ? " flex-row-reverse" : ""));
    const dot = mk("span", "h-3 w-3 shrink-0 rounded-full");
    const name = mk("span", "truncate text-sm sm:text-base");
    const chatBtn = mk("button", "relative ml-0.5 mr-0.5 flex h-7 w-7 shrink-0 items-center justify-center rounded-lg bg-felt/70 text-ink active:scale-95 focus:outline-none focus-visible:ring-2 focus-visible:ring-gold");
    chatBtn.type = "button";
    chatBtn.setAttribute("aria-label", "Open chat");
    chatBtn.innerHTML = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-4.6A8 8 0 1 1 21 12z"/></svg>';
    const badge = mk("span", "absolute -right-1.5 -top-1.5 hidden min-w-[18px] rounded-full bg-[#e5484d] px-1 text-center text-[11px] font-bold leading-[18px] text-white");
    chatBtn.appendChild(badge);
    chatBtn.hidden = true;
    chatBtn.addEventListener("click", openChat);
    line.append(dot, name, chatBtn);
    const bubble = mk("div", "pointer-events-none absolute z-20 max-w-[90%] break-words rounded-xl bg-paper px-3 py-1.5 text-sm font-semibold leading-snug text-[#23302c] shadow-lg " + (top ? "top-full mt-1.5 " : "bottom-full mb-1.5 ") + (right ? "right-1" : "left-1"));
    bubble.hidden = true;
    t.appendChild(bubble);
    const meta = mk("div", "truncate text-xs text-muted tabular-nums");
    info.append(line, meta);
    const slot = mk("div", "flex h-12 w-12 shrink-0 items-center justify-center min-[400px]:h-14 min-[400px]:w-14 sm:h-16 sm:w-16");
    t.append(info, slot);
    return { t, dot, name, meta, slot, chatBtn, badge, bubble };
  });

  function renderTags() {
    updateRotation();
    repaint();
    const k = rotTarget / 90;
    const s = state;
    const dieColor = rolling ? rollColor
      : (holdColor && Date.now() < holdUntil) ? holdColor
      : (s.phase === "playing" ? s.turn : null);
    for (const c of COLORS) {
      const g = tags[(CI[c] + k) % 4];
      const seat = s.seats[c];
      const isTurn = s.phase === "playing" && s.turn === c;
      g.t.classList.toggle("border-gold", isTurn);
      g.t.classList.toggle("border-transparent", !isTurn);
      g.t.style.background = seat ? `color-mix(in srgb, ${dHex(c)} ${isTurn ? 34 : 18}%, transparent)` : "rgba(255,255,255,.03)";
      g.t.style.opacity = seat ? "1" : ".5";
      g.dot.style.background = seat ? dHex(c) : "#2c5a51";
      const you = seat && ((isNet() && seat.id === myId) || (mode === "computer" && seat.id === "me"));
      g.name.textContent = seat ? seat.nick + (you ? " (you)" : "") : "Empty";
      const home = s.tokens[c].filter(p => p === FINISH).length;
      const place = s.winners.indexOf(c);
      let meta = !seat ? (s.phase === "lobby" ? "Waiting for a player" : "No player")
        : place >= 0 ? `Finished #${place + 1}`
        : s.phase === "lobby" ? "Ready"
        : isTurn ? (seat.bot ? "Thinking…" : mine(s, c) ? (s.roll ? "Pick a token" : "Your roll") : (s.roll ? "Moving…" : "Rolling…"))
        : `${home}/4 home` + (seat.bot ? " · Computer" : "");
      if (isTurn && mode === "online" && !seat.bot) meta += ` · ${secsLeft(turnSeenAt + ONLINE_TURN_LIMIT)}s`;
      g.meta.textContent = meta;
      if (dieColor === c && dieEl.parentNode !== g.slot) g.slot.appendChild(dieEl);
      // chat icon on my own tag (online / friends)
      const showChat = !!(you && isNet() && online);
      g.chatBtn.hidden = !showChat;
      g.badge.textContent = unread > 9 ? "9+" : String(unread);
      g.badge.classList.toggle("hidden", !unread);
      // latest message from this player as a speech bubble
      const b = seat && bubbles[seat.id];
      if (b && Date.now() < b.until) { g.bubble.textContent = b.text; g.bubble.hidden = false; }
      else g.bubble.hidden = true;
    }
    if (!dieColor && dieEl.parentNode) dieEl.remove();
  }

  // When did this device first see the current turn situation? Used for the
  // online move timer so phones with different clocks still agree.
  let turnKey = "", turnSeenAt = 0;
  function noteTurn() {
    const k = `${state.phase}|${state.turn}|${state.roll}|${state.last && state.last.seq}`;
    if (k !== turnKey) { turnKey = k; turnSeenAt = Date.now(); }
  }

  function render() {
    if ($("gameScreen").hidden) return;
    noteTurn();
    renderTokens();
    renderPanel();
    renderTags();
    if (!rolling) {
      const lv = state.roll || (state.last && state.last.v);
      if (lv && lv !== shownFace) drawFace(lv);
    }
    tickBots();
  }

  function onRemoteState() {
    const last = state.last;
    if (last && last.seq !== seenSeq) {
      const first = seenSeq === null;
      seenSeq = last.seq;
      if (!first) {
        rolling = true; rollColor = last.c; render();
        animateDie(last.v, () => { rolling = false; holdDie(last.c); render(); });
        return;
      }
    } else if (!last) seenSeq = 0;
    render();
  }

  // Host housekeeping every second: online countdowns and idle-player moves.
  setInterval(() => {
    if ($("gameScreen").hidden || !loaded) return;
    if (mode === "online" && isHost) {
      if (state.phase === "lobby" && state.startAt && Date.now() >= state.startAt && state.players.length >= 2) startGame();
      else if (state.phase === "playing" && !rolling && Date.now() - turnSeenAt > ONLINE_TURN_LIMIT) autoStep();
    }
    if (mode === "online" && (state.phase === "lobby" ? state.startAt : state.phase === "playing")) render();
  }, 1000);

  // ================================================================
  //  Networking (peer-to-peer via PeerJS)
  //  The first browser to open a room hosts it. Others connect to the host.
  //  If the host leaves, the next player to reconnect takes over.
  // ================================================================
  const PREFIX = "ludotable-v3-";
  let peer = null, isHost = false, conns = [], hostConn = null, gen = 0, retryTimer = null;

  const validState = s => s && typeof s === "object" && s.tokens && s.seats && Array.isArray(s.winners) && Array.isArray(s.players);
  const loadRoom = code => { try { const s = JSON.parse(lsGet("ludo2.room." + code)); return validState(s) ? s : null; } catch { return null; } };

  function setNet(kind, text) {
    $("netLed").className = "h-2 w-2 shrink-0 rounded-full " + (kind === "ok" ? "bg-[#4ade80]" : kind === "bad" ? "bg-[#f87171]" : "bg-muted");
    $("netText").textContent = text;
  }
  function netSummary() {
    if (isHost) {
      const n = conns.filter(c => c.open).length;
      setNet("ok", mode === "online" ? `Live · public table · ${n + 1} connected` : n ? `Live · hosting · ${n} friend${n > 1 ? "s" : ""} connected` : "Live · hosting · tap Invite to add friends");
    } else setNet("ok", mode === "online" ? "Live · public table" : "Live · connected to the table");
  }
  function broadcast() {
    const msg = { type: "state", state };
    if (isHost) conns.forEach(c => { if (c.open) c.send(msg); });
    else if (hostConn && hostConn.open) hostConn.send(msg);
  }
  // A state arrived from the network
  function accept(incoming) {
    if (!validState(incoming)) return false;
    if (loaded && (incoming.v || 0) < (state.v || 0)) return false;
    const first = !loaded;
    state = incoming; loaded = true; persist();
    if (first) onFirstState();
    onRemoteState();
    return true;
  }
  // Called once a room's state is known
  function onFirstState() {
    if (searching) {
      const fits = state.phase === "lobby" && (state.players.length < 4 || joined(state));
      if (!fits) { const n = searchN + 1; teardown(); loaded = false; findGame(n); return; }
      searching = false;
    }
    if (autoJoin && state.phase === "lobby" && !joined(state)) { autoJoin = false; setTimeout(() => actions.join(), 0); }
    autoJoin = false;
  }

  function teardown() {
    gen++;
    clearTimeout(retryTimer);
    conns.forEach(c => { try { c.close(); } catch {} });
    conns = []; hostConn = null; isHost = false;
    if (peer) { try { peer.destroy(); } catch {} peer = null; }
  }

  function openRoom(code, carry) {
    teardown();
    const my = gen;
    room = code; confirmReset = false;
    if (mode === "friends") { try { if (location.hash.slice(1) !== code) history.replaceState(null, "", location.pathname + location.search + "#" + code); } catch {} }
    if (!carry) { loaded = false; seenSeq = null; state = freshState(); }
    render();
    setNet("", searching ? `Looking for a table (${searchN + 1})…` : "Connecting…");
    peer = new Peer(PREFIX + code);
    peer.on("open", () => {
      if (my !== gen) return;
      isHost = true; online = true;
      state = carry || (mode === "friends" && loadRoom(code)) || freshState();
      const first = !loaded;
      loaded = true; persist();
      if (first) onFirstState();
      onRemoteState(); netSummary();
    });
    peer.on("connection", c => {
      if (my !== gen) return;
      conns.push(c);
      c.on("open", () => { c.send({ type: "state", state }); if (chat.length) c.send({ type: "chatHistory", msgs: chat }); netSummary(); });
      c.on("data", m => {
        if (!m || typeof m !== "object") return;
        if (m.type === "hello") c.pid = String(m.id || "");
        else if (m.type === "join" && typeof m.id === "string") { c.pid = m.id; hostJoin(m.id, String(m.nick || "Player").slice(0, 16)); }
        else if (m.type === "leave" && typeof m.id === "string") hostLeave(m.id);
        else if (m.type === "start") startGame();
        else if (m.type === "chat") { if (addChat(m)) conns.forEach(o => { if (o !== c && o.open) o.send(m); }); }
        else if (m.type === "state" && accept(m.state)) conns.forEach(o => { if (o !== c && o.open) o.send({ type: "state", state }); });
      });
      c.on("close", () => {
        conns = conns.filter(x => x !== c);
        if (my !== gen) return;
        if (c.pid && state.phase === "lobby") hostLeave(c.pid);
        netSummary();
      });
    });
    peer.on("error", e => {
      if (my !== gen) return;
      if (e.type === "unavailable-id") { try { peer.destroy(); } catch {} joinAsGuest(code, my, carry); }
      else if (["network", "server-error", "socket-error"].includes(e.type)) {
        setNet("bad", "Reconnecting…");
        retryTimer = setTimeout(() => { if (my === gen) openRoom(code, loaded ? state : null); }, 2500);
      }
    });
    peer.on("disconnected", () => { if (my === gen && peer && !peer.destroyed) { try { peer.reconnect(); } catch {} } });
  }

  function joinAsGuest(code, my, carry) {
    isHost = false;
    peer = new Peer();
    const rejoin = () => {
      if (my !== gen) return;
      setNet("bad", "Host left · taking over the table…");
      retryTimer = setTimeout(() => { if (my === gen) openRoom(code, loaded ? state : carry || null); }, 600 + Math.random() * 1400);
    };
    peer.on("open", () => {
      if (my !== gen) return;
      hostConn = peer.connect(PREFIX + code, { reliable: true });
      hostConn.on("open", () => {
        online = true;
        hostConn.send({ type: "hello", id: myId });
        if (carry) hostConn.send({ type: "state", state: carry });
        netSummary(); render();
      });
      hostConn.on("data", m => {
        if (!m) return;
        if (m.type === "state") accept(m.state);
        else if (m.type === "chat") addChat(m);
        else if (m.type === "chatHistory" && Array.isArray(m.msgs)) m.msgs.slice(-40).forEach(x => addChat(x, true));
      });
      hostConn.on("close", rejoin);
    });
    peer.on("error", e => {
      if (my !== gen) return;
      if (e.type === "peer-unavailable") rejoin();
      else { setNet("bad", "Reconnecting…"); retryTimer = setTimeout(() => { if (my === gen) openRoom(code, loaded ? state : null); }, 2500); }
    });
  }

  // ================================================================
  //  Header controls
  // ================================================================
  const roomPanel = $("roomPanel");
  $("roomBtn").addEventListener("click", () => {
    const open = roomPanel.hidden;
    roomPanel.hidden = !open;
    roomPanel.classList.toggle("hidden", !open);
    roomPanel.classList.toggle("flex", open);
    $("roomBtn").setAttribute("aria-expanded", String(open));
    if (open) $("roomInput").focus();
  });
  const closeRoomPanel = () => { roomPanel.hidden = true; roomPanel.classList.add("hidden"); roomPanel.classList.remove("flex"); $("roomBtn").setAttribute("aria-expanded", "false"); };
  $("joinRoom").addEventListener("click", () => {
    const v = $("roomInput").value.trim().toLowerCase().replace(/[^a-z0-9]/g, "");
    if (v.length < 3) { showBanner("Room codes are 3 to 12 letters or numbers."); return; }
    showBanner(""); $("roomInput").value = ""; closeRoomPanel();
    leaveCurrent(); startFriends(v);
  });
  $("roomInput").addEventListener("keydown", e => { if (e.key === "Enter") $("joinRoom").click(); });
  $("newRoom").addEventListener("click", () => {
    const code = newCode();
    closeRoomPanel();
    leaveCurrent(); startFriends(code);
    showBanner(`New room ${code} is ready. Tap Invite and send the link to your friends.`);
  });
  $("copyLink").addEventListener("click", async () => {
    const link = location.origin + location.pathname + "#" + room;
    if (navigator.share) {
      try { await navigator.share({ title: "Ludo Table", text: `Join my Ludo room ${room}`, url: link }); return; } catch (e) { if (e && e.name === "AbortError") return; }
    }
    try { await navigator.clipboard.writeText(link); showBanner(`Invite link copied: ${link}`); }
    catch { showBanner(`Send this link to your friends: ${link}`); }
  });
  let menuTimer = null;
  $("menuBtn").addEventListener("click", () => {
    const risky = !$("gameScreen").hidden && isNet() && state.phase === "playing" && mySlot();
    if (risky && !confirmMenu) {
      confirmMenu = true; render();
      clearTimeout(menuTimer); menuTimer = setTimeout(() => { confirmMenu = false; render(); }, 3000);
      return;
    }
    confirmMenu = false;
    leaveCurrent(); mode = null; renderMenu();
  });
  window.addEventListener("hashchange", () => {
    const v = location.hash.slice(1).toLowerCase();
    if (/^[a-z0-9]{3,12}$/.test(v) && v !== room) { leaveCurrent(); startFriends(v); }
  });

  // ================================================================
  //  Boot: an invite link (#code) opens that friends room, otherwise the menu
  // ================================================================
  const hash = (location.hash || "").slice(1).toLowerCase();
  if (/^[a-z0-9]{3,12}$/.test(hash) && !hash.startsWith("pub")) {
    mode = "friends";
    showScreen("game");
    openRoom(hash);
  } else {
    renderMenu();
  }
})();
</script>
</body>
</html>
